<svg viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#9ece6a"/>
      <animate attributeName="x1" values="-1200;0;-1200" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1200;2400;1200" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <style>
    .title { font: 800 62px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: 10px; }
    .sub   { font: 600 20px 'Courier New', monospace; letter-spacing: 6px; }
    .tag   { font: 500 15px 'Courier New', monospace; letter-spacing: 3px; }
    .node  { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .n1 { animation-delay: 0s; } .n2 { animation-delay: .4s; } .n3 { animation-delay: .8s; }
    .n4 { animation-delay: 1.2s; } .n5 { animation-delay: 1.6s; } .n6 { animation-delay: 2s; }
    .link  { stroke-dasharray: 5 7; animation: flow 2.5s linear infinite; }
    .scan  { animation: scan 5s linear infinite; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes pulse { 0%,100% { opacity:.25; } 50% { opacity:1; } }
    @keyframes flow  { to { stroke-dashoffset: -120; } }
    @keyframes scan  { 0% { transform: translateY(-330px);} 100% { transform: translateY(330px);} }
    @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
  </style>

  <!-- backdrop -->
  <rect width="1200" height="320" rx="18" fill="#0d1117"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#1f2937" stroke-width="1" opacity="0.5">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200"/>
    <path d="M150 0 V320 M300 0 V320 M450 0 V320 M600 0 V320 M750 0 V320 M900 0 V320 M1050 0 V320"/>
  </g>

  <!-- left neural cluster -->
  <g class="link" stroke="#00f0ff" stroke-width="1.5" opacity="0.7">
    <path d="M70 90 L150 160 L70 230 M150 160 L230 110 M150 160 L230 210"/>
  </g>
  <circle class="node n1" cx="70"  cy="90"  r="7" fill="#00f0ff"/>
  <circle class="node n2" cx="70"  cy="230" r="7" fill="#9ece6a"/>
  <circle class="node n3" cx="150" cy="160" r="9" fill="#bb9af7"/>
  <circle class="node n4" cx="230" cy="110" r="6" fill="#00f0ff"/>
  <circle class="node n5" cx="230" cy="210" r="6" fill="#7aa2f7"/>

  <!-- right neural cluster (mirrored) -->
  <g class="link" stroke="#bb9af7" stroke-width="1.5" opacity="0.7">
    <path d="M1130 90 L1050 160 L1130 230 M1050 160 L970 110 M1050 160 L970 210"/>
  </g>
  <circle class="node n6" cx="1130" cy="90"  r="7" fill="#bb9af7"/>
  <circle class="node n1" cx="1130" cy="230" r="7" fill="#00f0ff"/>
  <circle class="node n2" cx="1050" cy="160" r="9" fill="#9ece6a"/>
  <circle class="node n3" cx="970"  cy="110" r="6" fill="#7aa2f7"/>
  <circle class="node n4" cx="970"  cy="210" r="6" fill="#bb9af7"/>

  <!-- title -->
  <text class="title" x="600" y="150" text-anchor="middle" fill="url(#titleGrad)">KESHAV SHARMA</text>
  <text class="sub" x="600" y="195" text-anchor="middle" fill="#7aa2f7">AI ENGINEER :: AGENTIC SYSTEMS :: 0→1</text>
  <text class="tag" x="600" y="235" text-anchor="middle" fill="#565f89">FOUNDING ENGINEER @ IMPORTEX  ·  NASA SPACE APPS GLOBAL WINNER<tspan class="blink" fill="#00f0ff">▊</tspan></text>

  <!-- scanline -->
  <g class="scan">
    <rect x="0" y="0" width="1200" height="3" fill="#00f0ff" opacity="0.12" filter="url(#blur)"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#00f0ff" stroke-width="2" opacity="0.8">
    <path d="M20 40 V20 H40 M1160 20 H1180 V40 M1180 280 V300 H1160 M40 300 H20 V280" fill="none"/>
  </g>
</svg>
