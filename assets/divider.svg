<svg viewBox="0 0 1200 6" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#0d1117"/>
      <stop offset="0.3" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="0.7" stop-color="#9ece6a"/>
      <stop offset="1"   stop-color="#0d1117"/>
      <animate attributeName="x1" values="-1200;1200" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2400" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="6" rx="3" fill="url(#flow)"/>
</svg>
